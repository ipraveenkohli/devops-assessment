#version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: "config.settings"
      PYTHONUNBUFFERED: "1"
      ALLOWED_HOSTS: '["*"]'
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
